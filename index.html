<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Подтверждение личности | reCAPTCHA v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(56, 189, 248, 0.2);
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            color: #f1f5f9;
        }

        .icon-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.75rem;
        }

        .shield-icon {
            background: rgba(56, 189, 248, 0.15);
            border-radius: 50%;
            width: 5rem;
            height: 5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.3);
        }

        .shield-icon svg {
            width: 2.8rem;
            height: 2.8rem;
            stroke: #38bdf8;
            fill: none;
            stroke-width: 1.8;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: -0.3px;
            margin-bottom: 0.6rem;
            color: white;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            padding-bottom: 1.5rem;
        }

        .captcha-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .verify-btn {
            width: 100%;
            background: linear-gradient(145deg, #0369a1, #0284c7);
            border: none;
            border-radius: 1.2rem;
            padding: 1rem 1.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background 0.25s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 10px 20px -8px rgba(2, 132, 199, 0.5);
            letter-spacing: 0.3px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .verify-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, #0284c7, #0ea5e9);
            box-shadow: 0 15px 25px -8px #0284c7;
        }

        .verify-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #334155;
            border-color: #475569;
            box-shadow: none;
        }

        .status-message {
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            min-height: 2rem;
            color: #94a3b8;
            transition: color 0.3s;
        }

        .recaptcha-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 1.3rem;
        }

        hr {
            border-color: rgba(148, 163, 184, 0.15);
            margin: 1rem 0 0.8rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Иконка щита -->
        <div class="icon-container">
            <div class="shield-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" fill="none">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4" />
                </svg>
            </div>
        </div>

        <!-- Заголовок -->
        <h1>Подтверждение личности</h1>
        <p class="subtitle">
            Поставьте галочку "Я не робот" и нажмите подтвердить.
        </p>

        <!-- reCAPTCHA v2 -->
        <div class="captcha-wrapper">
            <div class="g-recaptcha" 
                 data-sitekey="6Lct9-ksAAAAAF5JQJWH3sxyLr6YWqpHwUYtlu4Y"
                 data-callback="onCaptchaSuccess"
                 data-expired-callback="onCaptchaExpired">
            </div>
        </div>

        <!-- Кнопка подтверждения -->
        <button id="confirmBtn" class="verify-btn" disabled>
            ✓ Подтвердить
        </button>

        <!-- Сообщение статуса -->
        <div id="statusMessage" class="status-message">
            Сначала пройдите проверку reCAPTCHA
        </div>

        <!-- Нижний текст -->
        <hr />
        <div class="recaptcha-note">
            <span>🔒 Защищено reCAPTCHA · Конфиденциальность</span>
        </div>
    </div>

    <!-- API reCAPTCHA v2 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Логика -->
    <script>
        // Когда пользователь успешно прошёл капчу
        function onCaptchaSuccess(token) {
            const btn = document.getElementById('confirmBtn');
            const status = document.getElementById('statusMessage');

            btn.disabled = false;
            status.textContent = '✅ Проверка пройдена. Нажмите "Подтвердить"';
            status.style.color = '#4ade80';

            console.log('Токен reCAPTCHA:', token);
        }

        // Когда истекло время капчи (2 минуты)
        function onCaptchaExpired() {
            const btn = document.getElementById('confirmBtn');
            const status = document.getElementById('statusMessage');

            btn.disabled = true;
            status.textContent = '⏰ Проверка истекла. Пройдите заново.';
            status.style.color = '#f97316';
        }

        // Нажатие на кнопку "Подтвердить"
        document.getElementById('confirmBtn').addEventListener('click', function () {
            const token = grecaptcha.getResponse();

            if (!token) {
                alert('Пройдите проверку reCAPTCHA');
                return;
            }

            const status = document.getElementById('statusMessage');
            status.textContent = '⏳ Отправка на сервер...';
            status.style.color = '#facc15';
            this.disabled = true;

            // Имитация отправки токена на сервер (замените на реальный fetch)
            setTimeout(function () {
                status.textContent = '✅ Личность подтверждена! Добро пожаловать.';
                status.style.color = '#4ade80';
                console.log('Токен отправлен на сервер:', token);
            }, 1000);
        });
    </script>
</body>
</html>
